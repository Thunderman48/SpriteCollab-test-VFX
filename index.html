<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#14112a">
  <title>Pokémon Clash</title>
  <meta name="description" content="Pokémon Clash: a real-time Pokémon arena brawler with PMDCollab SpriteCollab sprites and PMD: Origins effects. 1v1, Trio 3v3 and 2vs2 for up to 4 players.">
  <link rel="preload" href="assets/ui/pmd-text.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="loading">
  <div id="app">
    <div id="stage">
      <canvas id="arena" aria-label="Battle arena"></canvas>
      <div id="hud"></div>
      <div id="log" class="win" aria-live="polite"></div>
    </div>
    <div class="touch-zone" aria-hidden="true"></div>

    <div id="lobby" class="screen"></div>
    <div id="setup" class="screen"></div>
    <div id="editor" class="screen overlay"></div>
    <div id="info" class="screen overlay"></div>
    <div id="settings" class="screen overlay"></div>
    <div id="credits" class="screen overlay"></div>
    <div id="result" class="screen overlay"></div>
    <div id="pause" class="screen overlay"></div>

    <div id="loading" class="screen">
      <div class="win solid">
        <span id="loading-status">Now loading... / 로딩 중...</span>
      </div>
    </div>
    <div id="rotate-hint" class="win solid"></div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
